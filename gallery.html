<!DOCTYPE HTML>
<html lang="en">
<head>
<META charset="UTF-8">
<META name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xanadu Kink Gallery</title>
<link rel="stylesheet" href="style.css">
<script type="text/javascript" src="utils.js"></script>
<style>
  body {
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background: #f5f5f5;
  }
  .carousel {
    position: relative;
    width: 600px;
    max-width: 90%;
    background: white;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 5px 20px rgba(0,0,0,0.2);
    text-align: center;
  }
  .carousel img {
    width: 100%;
    height: auto;
    display: block;
  }
  .caption {
    padding: 15px;
    background: #fff;
    font-size: 1rem;
    color: #333;
  }
  .nav-btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(0,0,0,0.5);
    color: white;
    border: none;
    padding: 10px 15px;
    cursor: pointer;
    font-size: 1.2rem;
    border-radius: 5px;
  }
  .nav-btn:hover {
    background: rgba(0,0,0,0.7);
  }
  .prev {
    left: 10px;
  }
  .next {
    right: 10px;
  }
</style>
</head>
<body>

<div id="grad">

    <p class="page_title">Xanadu Kink Photo Gallery</p>

    <div class="carousel">
    <button class="nav-btn prev">&#10094;</button>
    <button class="nav-btn next">&#10095;</button>
    <img id="carousel-image" src="" alt="Carousel Image">
    <div class="caption" id="carousel-caption"></div>
    </div>

    <script>
    const slides = [
      { img: "gallery/SpringIntensive2025HighProtocol-01.jpg", text: "SpringIntensive2025HighProtocol-01.jpg description" },
      { img: "gallery/SpringIntensive2025HighProtocol-02.jpg", text: "SpringIntensive2025HighProtocol-02.jpg description" },
      { img: "gallery/SpringIntensive2025HighProtocol-03.jpg", text: "SpringIntensive2025HighProtocol-03.jpg description" },
      { img: "gallery/SpringIntensive2025HighProtocol-04.jpg", text: "SpringIntensive2025HighProtocol-04.jpg description" },
      { img: "gallery/SpringIntensive2025HighProtocol-05.jpg", text: "SpringIntensive2025HighProtocol-05.jpg description" }
    ];

    let currentIndex = 0;
    const imageElement = document.getElementById('carousel-image');
    const captionElement = document.getElementById('carousel-caption');

    function showSlide(index) {
        currentIndex = (index + slides.length) % slides.length;
        imageElement.src = slides[currentIndex].img;
        captionElement.textContent = slides[currentIndex].text;
    }

    document.querySelector('.prev').addEventListener('click', () => {
        showSlide(currentIndex - 1);
    });

    document.querySelector('.next').addEventListener('click', () => {
        showSlide(currentIndex + 1);
    });

    // Auto-advance every 5 seconds
    setInterval(() => {
        showSlide(currentIndex + 1);
    }, 5000);

    // Initialize
    showSlide(currentIndex);
    </script>

    <div w3-include-html="footer.html"></div>
    <script>
        includeHTML();
    </script>
    
</div>

</body>
</html>
