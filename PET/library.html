<!DOCTYPE HTML>
<html lang="en">
<head>
<base href="/PET/"><script>(function(){var h=location.hostname;if(h==="localhost"||h==="127.0.0.1"||location.protocol==="file:")document.querySelector("base").href=location.href.replace(/[^/]*$/,"");})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="P.E.T. leadership library — teaching materials, meeting-topic notes, and presentation resources for chapter leaders.">
<meta name="robots" content="noindex, nofollow">
<meta name="rating" content="adult">
<title>Leadership Library — Power Exchange Together</title>
<link rel="stylesheet" href="style.css">
<script type="text/javascript" src="utils.js"></script>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
<script src="firebase-config.js"></script>
</head>

<body>

    <div w3-include-html="nav.html"></div>

    <section class="hero">
        <p class="eyebrow">Chapter Leaders Only</p>
        <h1 class="page_title">Leadership Library</h1>
        <p class="tag_line">Teaching materials, meeting-topic notes, and presentation resources.</p>
    </section>

    <div class="container">

        <!-- Shown while auth state is resolving / when logged out -->
        <div id="gate" class="panel text-center">
            <p class="text" id="gate-text">Checking access…</p>
        </div>

        <!-- Shown to authenticated leaders -->
        <div id="library-root" style="display:none;">
            <p id="library-status" class="text text-center muted">Loading resources…</p>
            <div id="library-content"></div>
        </div>

    </div>

    <div w3-include-html="footer.html"></div>
    <script>
        includeHTML();
        initAuthUI();
    </script>

    <script>
        // Category display order.
        var CATEGORY_ORDER = [
            'Meeting-Topic Notes',
            'Teaching Materials',
            'Presentation Resources'
        ];

        function escapeHtml(str) {
            return String(str == null ? '' : str)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        function renderResources(items) {
            var status = document.getElementById('library-status');
            var content = document.getElementById('library-content');

            if (!items || !items.length) {
                status.textContent = 'No resources have been added yet. Please check back soon.';
                content.innerHTML = '';
                return;
            }
            status.style.display = 'none';

            var groups = {};
            items.forEach(function (it) {
                var c = it.category || 'Other';
                (groups[c] = groups[c] || []).push(it);
            });

            var cats = CATEGORY_ORDER.filter(function (c) { return groups[c]; });
            Object.keys(groups).sort().forEach(function (c) {
                if (cats.indexOf(c) === -1) cats.push(c);
            });

            var html = '';
            cats.forEach(function (cat) {
                html += '<h2 class="library-category">' + escapeHtml(cat) + '</h2>';
                html += '<ul class="resource-list">';
                groups[cat]
                    .sort(function (a, b) { return (a.title || '').localeCompare(b.title || ''); })
                    .forEach(function (it) {
                        var link = it.fileUrl || it.externalUrl || '';
                        html += '<li class="resource-item">';
                        html += '<h4>' + escapeHtml(it.title || 'Untitled') + '</h4>';
                        if (it.description) {
                            html += '<p>' + escapeHtml(it.description) + '</p>';
                        }
                        if (link) {
                            html += '<a class="btn-outline" href="' + escapeHtml(link) +
                                    '" target="_blank" rel="noopener">Open resource →</a>';
                        }
                        html += '</li>';
                    });
                html += '</ul>';
            });
            content.innerHTML = html;
        }

        function loadLibrary() {
            var status = document.getElementById('library-status');
            db.collection('library_resources').get()
                .then(function (snap) {
                    var items = [];
                    snap.forEach(function (doc) {
                        var d = doc.data();
                        d.id = doc.id;
                        items.push(d);
                    });
                    renderResources(items);
                })
                .catch(function (err) {
                    status.textContent = 'Could not load resources: ' + err.message;
                });
        }

        auth.onAuthStateChanged(function (user) {
            var gate = document.getElementById('gate');
            var root = document.getElementById('library-root');
            if (user) {
                gate.style.display = 'none';
                root.style.display = 'block';
                loadLibrary();
            } else {
                root.style.display = 'none';
                gate.style.display = 'block';
                document.getElementById('gate-text').innerHTML =
                    'The library is available to approved chapter leaders. Please ' +
                    '<a href="login.html">log in</a>, or <a href="join.html">apply for a leadership account</a>.';
            }
        });
    </script>

</body>
</html>
