<!DOCTYPE HTML>
<html lang="en">
<head>
<base href="/PET/"><script>(function(){var h=location.hostname;if(h==="localhost"||h==="127.0.0.1"||location.protocol==="file:")document.querySelector("base").href=location.href.replace(/[^/]*$/,"");})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Manage your Power Exchange Together (P.E.T.) chapter leader profile.">
<meta name="robots" content="noindex, nofollow">
<meta name="rating" content="adult">
<title>My Profile — Power Exchange Together</title>
<link rel="stylesheet" href="style.css">
<script type="text/javascript" src="utils.js"></script>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
</head>

<body>

    <div w3-include-html="nav.html"></div>

    <section class="hero">
        <p class="eyebrow">Leadership</p>
        <h1 class="page_title">My Profile</h1>
    </section>

    <div class="container">

        <div id="login-prompt" class="panel text-center" style="display:none;">
            <p class="text">Please <a href="login.html">log in</a> to manage your profile.</p>
        </div>

        <div id="profile-panel" class="panel form-wrap" style="display:none;">
            <p class="text muted">Signed in as <strong id="profileEmail"></strong>.</p>

            <form id="profileForm" class="pet-form" onsubmit="return saveProfile(event);">
                <label>Display Name
                    <input type="text" name="displayName" required>
                </label>
                <label>Chapter
                    <input type="text" name="chapter" placeholder="e.g. Richmond, Virginia">
                </label>
                <label>Region
                    <select name="region">
                        <option value="">Select a region…</option>
                        <option>Canada</option>
                        <option>Northeast &amp; Mid-Atlantic</option>
                        <option>Southeast</option>
                        <option>Midwest</option>
                        <option>West</option>
                        <option>Pacific &amp; International</option>
                        <option>Other</option>
                    </select>
                </label>
                <label>Role in Chapter
                    <input type="text" name="role_in_chapter" placeholder="e.g. Chapter Lead, Co-Lead, Educator">
                </label>
                <label>Public Contact Email
                    <input type="email" name="contactEmail" placeholder="Shown on the chapters directory">
                </label>
                <label>Bio
                    <textarea name="bio" rows="5"></textarea>
                </label>
                <div class="text-center">
                    <button type="submit" class="btn-accent">Save Profile</button>
                </div>
                <p id="profileMessage" class="auth-message"></p>
            </form>

            <hr>
            <p class="text-center">
                <a href="change_password.html">Change your password</a> &nbsp;·&nbsp;
                <a href="#" onclick="auth.signOut(); return false;">Logout</a>
            </p>
        </div>

    </div>

    <div w3-include-html="footer.html"></div>
    <script>
        includeHTML();
        initAuthUI();
    </script>

    <script>
        var currentUser = null;

        function showProfileMsg(msg, color) {
            var el = document.getElementById('profileMessage');
            el.textContent = msg;
            el.style.color = color;
        }

        function fillForm(data) {
            var form = document.getElementById('profileForm');
            ['displayName', 'chapter', 'region', 'role_in_chapter', 'contactEmail', 'bio'].forEach(function (k) {
                if (form.elements[k] && data[k] != null) form.elements[k].value = data[k];
            });
        }

        function saveProfile(event) {
            event.preventDefault();
            if (!currentUser) return false;
            var form = document.getElementById('profileForm');
            var data = new FormData(form);

            var profile = {
                displayName: (data.get('displayName') || '').trim(),
                chapter: (data.get('chapter') || '').trim(),
                region: data.get('region') || '',
                role_in_chapter: (data.get('role_in_chapter') || '').trim(),
                contactEmail: (data.get('contactEmail') || '').trim(),
                bio: (data.get('bio') || '').trim(),
                email: currentUser.email,
                authUid: currentUser.uid,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            };

            var btn = form.querySelector('button[type="submit"]');
            if (btn) btn.disabled = true;
            showProfileMsg('Saving…', 'var(--text-muted)');

            db.collection('leaders').doc(currentUser.uid).set(profile, { merge: true })
                .then(function () {
                    // Keep the Firebase Auth display name in sync.
                    if (profile.displayName && currentUser.displayName !== profile.displayName) {
                        return currentUser.updateProfile({ displayName: profile.displayName });
                    }
                })
                .then(function () { showProfileMsg('Profile saved.', '#2e7d32'); })
                .catch(function (err) { showProfileMsg('Error: ' + err.message, '#b23b3b'); })
                .finally(function () { if (btn) btn.disabled = false; });

            return false;
        }

        auth.onAuthStateChanged(function (user) {
            var prompt = document.getElementById('login-prompt');
            var panel = document.getElementById('profile-panel');
            if (!user) {
                currentUser = null;
                prompt.style.display = 'block';
                panel.style.display = 'none';
                return;
            }
            currentUser = user;
            prompt.style.display = 'none';
            panel.style.display = 'block';
            document.getElementById('profileEmail').textContent = user.email;

            // Seed display name from the auth profile, then load the stored doc.
            if (user.displayName) {
                document.getElementById('profileForm').elements['displayName'].value = user.displayName;
            }
            db.collection('leaders').doc(user.uid).get()
                .then(function (doc) { if (doc.exists) fillForm(doc.data()); })
                .catch(function (err) { console.warn('Could not load profile:', err.message); });
        });
    </script>

</body>
</html>
