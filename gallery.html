  .carousel {

    max-width: 90%;

    overflow: hidden;
    box-shadow: 0 5px 20px rgba(0,0,0,0.2);

  }
  .carousel img {

    height: auto;
    display: block;
  }
  .caption {
    padding: 15px;
    background: #fff;
    font-size: 1rem;
    color: #333;
  }
  .nav-btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(0,0,0,0.5);
    color: white;
    border: none;
    padding: 10px 15px;
    cursor: pointer;
    font-size: 1.2rem;
    border-radius: 5px;
  }
  .nav-btn:hover {
    background: rgba(0,0,0,0.7);
  }
  .prev {

  }
  .next {
