<!DOCTYPE HTML>
<html lang="en">
<head>
<base href="/PET/"><script>(function(){var h=location.hostname;if(h==="localhost"||h==="127.0.0.1"||location.protocol==="file:")document.querySelector("base").href=location.href.replace(/[^/]*$/,"");})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Change your Power Exchange Together (P.E.T.) leader account password.">
<meta name="robots" content="noindex, nofollow">
<meta name="rating" content="adult">
<title>Change Password — Power Exchange Together</title>
<link rel="stylesheet" href="style.css">
<script type="text/javascript" src="utils.js"></script>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
</head>

<body>

    <div w3-include-html="nav.html"></div>

    <section class="hero">
        <p class="eyebrow">Account</p>
        <h1 class="page_title">Change Password</h1>
    </section>

    <div class="container">

        <div id="login-prompt" class="panel text-center" style="display:none;">
            <p class="text">Please <a href="login.html">log in</a> to change your password.</p>
        </div>

        <div id="pw-panel" class="panel form-wrap" style="display:none;">
            <p class="text muted">Signed in as <strong id="pwEmail"></strong>.</p>
            <p class="text">
                For your security, you'll re-enter your current password before choosing a new one.
            </p>

            <form id="pwForm" class="pet-form" onsubmit="return changePassword(event);">
                <label>Current Password
                    <input type="password" id="currentPassword" required>
                </label>
                <label>New Password (at least 6 characters)
                    <input type="password" id="newPassword" required minlength="6">
                </label>
                <label>Confirm New Password
                    <input type="password" id="confirmPassword" required minlength="6">
                </label>
                <div class="text-center">
                    <button type="submit" class="btn-accent">Update Password</button>
                </div>
                <p id="pwMessage" class="auth-message"></p>
            </form>
        </div>

    </div>

    <div w3-include-html="footer.html"></div>
    <script>
        includeHTML();
        initAuthUI();
    </script>

    <script>
        function showPwMsg(msg, color) {
            var el = document.getElementById('pwMessage');
            el.textContent = msg;
            el.style.color = color;
        }

        function changePassword(event) {
            event.preventDefault();
            var user = auth.currentUser;
            if (!user) { showPwMsg('You are not logged in.', '#b23b3b'); return false; }

            var current = document.getElementById('currentPassword').value;
            var next = document.getElementById('newPassword').value;
            var confirm = document.getElementById('confirmPassword').value;

            if (next !== confirm) {
                showPwMsg('New passwords do not match.', '#b23b3b');
                return false;
            }

            var credential = firebase.auth.EmailAuthProvider.credential(user.email, current);
            var btn = document.querySelector('#pwForm button[type="submit"]');
            if (btn) btn.disabled = true;
            showPwMsg('Updating…', 'var(--text-muted)');

            user.reauthenticateWithCredential(credential)
                .then(function () { return user.updatePassword(next); })
                .then(function () {
                    showPwMsg('Password updated successfully.', '#2e7d32');
                    document.getElementById('pwForm').reset();
                })
                .catch(function (err) {
                    var msg = err.code === 'auth/wrong-password' || err.code === 'auth/invalid-credential'
                        ? 'Your current password is incorrect.'
                        : err.message;
                    showPwMsg(msg, '#b23b3b');
                })
                .finally(function () { if (btn) btn.disabled = false; });

            return false;
        }

        auth.onAuthStateChanged(function (user) {
            var prompt = document.getElementById('login-prompt');
            var panel = document.getElementById('pw-panel');
            if (user) {
                prompt.style.display = 'none';
                panel.style.display = 'block';
                document.getElementById('pwEmail').textContent = user.email;
            } else {
                prompt.style.display = 'block';
                panel.style.display = 'none';
            }
        });
    </script>

</body>
</html>
