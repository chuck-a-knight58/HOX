<!DOCTYPE HTML>
<html lang="en">
<head>

<META charset="UTF-8">
<META name="viewport" content="width=device-width, initial-scale=1.0">
<META name="description" content="Xanadu Reserve Admin">
<meta name="robots" content="noindex, nofollow">
<meta name="rating" content="adult">
<link rel="canonical" href="https://www.xanadukink.com/XR/admin.html">

<meta name="theme-color" content="#daa520">
<title>Admin — Xanadu Reserve</title>
<link rel="stylesheet" href="style.css">

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>

<style>
    .admin-container {
        max-width: 900px;
        margin: 20px auto;
        padding: 0 20px;
    }
    .app-card {
        border: 1px solid goldenrod;
        padding: 20px;
        margin-bottom: 20px;
        background: #111;
    }
    .app-card h3 {
        margin-top: 0;
        border-bottom: 1px solid goldenrod;
        padding-bottom: 8px;
    }
    .app-field {
        margin: 6px 0;
    }
    .app-field strong {
        display: inline-block;
        min-width: 200px;
    }
    .app-actions {
        margin-top: 15px;
        display: flex;
        gap: 10px;
        align-items: center;
    }
    .btn-approve {
        padding: 8px 24px;
        background: #2e7d32;
        color: white;
        border: none;
        font-size: 14px;
        font-weight: bold;
        cursor: pointer;
    }
    .btn-approve:hover { background: #1b5e20; }
    .btn-reject {
        padding: 8px 24px;
        background: #c62828;
        color: white;
        border: none;
        font-size: 14px;
        font-weight: bold;
        cursor: pointer;
    }
    .btn-reject:hover { background: #8e0000; }
    .btn-hold {
        padding: 8px 24px;
        background: #6a1b9a;
        color: white;
        border: none;
        font-size: 14px;
        font-weight: bold;
        cursor: pointer;
    }
    .btn-hold:hover { background: #4a148c; }
    .status-badge {
        display: inline-block;
        padding: 3px 10px;
        font-size: 12px;
        font-weight: bold;
        text-transform: uppercase;
    }
    .status-pending { background: #e65100; color: white; }
    .status-approved { background: #2e7d32; color: white; }
    .status-rejected { background: #c62828; color: white; }
    .status-hold { background: #6a1b9a; color: white; }
    .app-search {
        width: 100%;
        padding: 8px 10px;
        background: #1a1a1a;
        color: goldenrod;
        border: 1px solid goldenrod;
        box-sizing: border-box;
        margin-bottom: 12px;
    }
    .app-search::placeholder { color: #8a7a3a; }
    #app-count { margin-bottom: 12px; font-size: 14px; }
    .tab-bar {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
        border-bottom: 1px solid goldenrod;
        padding-bottom: 10px;
    }
    .tab-btn {
        padding: 8px 20px;
        background: none;
        color: goldenrod;
        border: 1px solid goldenrod;
        cursor: pointer;
        font-size: 14px;
    }
    .tab-btn.active {
        background: goldenrod;
        color: black;
        font-weight: bold;
    }
    .tab-btn:hover:not(.active) {
        background: #333;
    }
    .admin-toolbar {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 10px;
        margin-bottom: 15px;
    }
    .btn-export {
        padding: 8px 20px;
        background: goldenrod;
        color: black;
        border: 1px solid goldenrod;
        font-size: 14px;
        font-weight: bold;
        cursor: pointer;
    }
    .btn-export:hover { background: #c8960e; }
    .btn-export:disabled { opacity: 0.6; cursor: not-allowed; }
    #admin-message {
        text-align: center;
        padding: 10px;
        display: none;
        margin-bottom: 15px;
    }
    #access-denied, #loading-msg {
        text-align: center;
        padding: 40px 20px;
    }
</style>
</head>

<body style="color: rgb(171, 119, 14);">

    <div>

        <p class="page_title">Admin - Member Management</p>

        <div id="loading-msg">Loading...</div>

        <div id="access-denied" style="display: none;">
            <h2>Access Denied</h2>
            <p>You must be logged in as an admin to view this page.</p>
            <p><a href="login.html">Login</a></p>
        </div>

        <div id="admin-content" class="admin-container" style="display: none;">

            <div id="admin-message"></div>

            <div class="admin-toolbar">
                <button id="export-members-btn" class="btn-export" onclick="exportMembersCsv()">Export Members (CSV)</button>
                <a class="btn-export" href="newsletter.html" style="text-decoration:none;">Manage Newsletter Subscribers &rarr;</a>
            </div>

            <div class="tab-bar">
                <button class="tab-btn active" onclick="switchTab('pending')">Pending</button>
                <button class="tab-btn" onclick="switchTab('approved')">Approved</button>
                <button class="tab-btn" onclick="switchTab('hold')">Hold</button>
                <button class="tab-btn" onclick="switchTab('rejected')">Rejected</button>
            </div>

            <input type="text" id="app-search" class="app-search"
                   placeholder="Search by email, full name, or FetLife name…" autocomplete="off"
                   oninput="renderApplications()">
            <div id="app-count"></div>
            <div id="applications-list"></div>

        </div>

        <script>
            // -----------------------------------------------------------
            // Admin emails — add your admin email addresses here
            // -----------------------------------------------------------
            var ADMIN_EMAILS = [
                'chuck@xanadukink.com',
                'chuck.a.knight@gmail.com',
                'l.knight@me.com'
            ];

            var currentTab = 'pending';
            var currentApps = [];   // cached apps for the active tab (for search/sort)

            // ---- Auth gate ----
            auth.onAuthStateChanged(function (user) {
                document.getElementById('loading-msg').style.display = 'none';

                if (!user || ADMIN_EMAILS.indexOf(user.email) === -1) {
                    document.getElementById('access-denied').style.display = 'block';
                    document.getElementById('admin-content').style.display = 'none';
                    return;
                }

                document.getElementById('admin-content').style.display = 'block';
                loadApplications('pending');
            });

            // ---- Tab switching ----
            function switchTab(status) {
                currentTab = status;
                var btns = document.querySelectorAll('.tab-btn');
                btns.forEach(function (btn) {
                    btn.classList.remove('active');
                    if (btn.textContent.toLowerCase() === status) {
                        btn.classList.add('active');
                    }
                });

                loadApplications(status);
            }

            // ---- Load applications for a status, then hand off to render ----
            function loadApplications(status) {
                var listEl = document.getElementById('applications-list');
                var countEl = document.getElementById('app-count');
                listEl.innerHTML = '<p style="text-align:center;">Loading...</p>';
                countEl.textContent = '';

                db.collection('applications')
                    .where('status', '==', status)
                    .get()
                    .then(function (snapshot) {
                        var apps = [];
                        snapshot.forEach(function (doc) {
                            var d = doc.data();
                            d._id = doc.id;
                            apps.push(d);
                        });
                        // Alphabetical by full name (fall back to email).
                        apps.sort(function (a, b) {
                            var an = (a.full_name || a.email || '').toLowerCase();
                            var bn = (b.full_name || b.email || '').toLowerCase();
                            return an.localeCompare(bn);
                        });
                        currentApps = apps;
                        renderApplications();
                    })
                    .catch(function (error) {
                        currentApps = [];
                        listEl.innerHTML = '<p style="color: #ff6b6b; text-align:center;">Error loading applications: ' + escapeHtml(error.message) + '</p>';
                    });
            }

            // ---- Render the cached apps, filtered by the search box ----
            // Search matches email, full name, and FetLife name.
            function renderApplications() {
                var listEl = document.getElementById('applications-list');
                var countEl = document.getElementById('app-count');
                var status = currentTab;
                var termEl = document.getElementById('app-search');
                var term = (termEl && termEl.value ? termEl.value : '').trim().toLowerCase();

                if (!currentApps.length) {
                    listEl.innerHTML = '<p style="text-align:center;">No ' + status + ' applications.</p>';
                    countEl.textContent = '';
                    return;
                }

                var filtered = currentApps.filter(function (d) {
                    if (!term) return true;
                    return (d.email && d.email.toLowerCase().indexOf(term) !== -1)
                        || (d.full_name && d.full_name.toLowerCase().indexOf(term) !== -1)
                        || (d.fetlife_name && d.fetlife_name.toLowerCase().indexOf(term) !== -1);
                });

                var total = currentApps.length;
                var plural = total === 1 ? '' : 's';

                if (!filtered.length) {
                    listEl.innerHTML = '<p style="text-align:center;">No ' + status + ' applications match “' + escapeHtml(term) + '”.</p>';
                    countEl.textContent = '0 of ' + total + ' ' + status + ' application' + plural;
                    return;
                }

                var html = '';
                filtered.forEach(function (d) {
                    var docId = d._id;
                    var submitted = d.submittedAt && d.submittedAt.toDate ? d.submittedAt.toDate().toLocaleDateString() : 'N/A';
                    var roles = Array.isArray(d.roles) ? d.roles.join(', ') : (d.roles || 'N/A');

                    html += '<div class="app-card">';
                    html += '<h3>' + escapeHtml(d.full_name || 'No Name') + ' <span class="status-badge status-' + status + '">' + status + '</span></h3>';
                    html += field('Type', d.type);
                    if (d.type === 'Attendance Request') {
                        html += field('Event Name', d.event_name);
                        html += field('Event Date', d.event_date);
                    }
                    html += field('Email', d.email);
                    html += field('Preferred Name', d.preferred_name);
                    html += field('FetLife Name', d.fetlife_name);
                    html += field('Phone', d.phone);
                    html += field('Birthday', d.birthday);
                    html += field('Attended Before', d.attended_before);
                    html += field('Experience', d.experience);
                    html += field('Roles', roles);
                    html += field('Community Contribution', d.community_contribution);
                    html += field('Elegance Meaning', d.elegance_meaning);
                    html += field('Dietary', d.dietary);
                    html += field('Notes', d.notes);
                    html += field('Submitted', submitted);

                    html += '<div class="app-actions">';
                    if (status === 'pending') {
                        if (d.type === 'Attendance Request') {
                            html += '<button class="btn-approve" onclick="approveAttendance(\'' + docId + '\', \'' + escapeAttr(d.email) + '\', \'' + escapeAttr(d.full_name) + '\')">Approve Attendance</button>';
                        } else {
                            html += '<button class="btn-approve" onclick="approveApplication(\'' + docId + '\', \'' + escapeAttr(d.email) + '\', \'' + escapeAttr(d.full_name) + '\')">Approve &amp; Create Account</button>';
                        }
                        html += '<button class="btn-hold" onclick="holdApplication(\'' + docId + '\')">Hold</button>';
                        html += '<button class="btn-reject" onclick="rejectApplication(\'' + docId + '\')">Reject</button>';
                    } else if (status === 'hold') {
                        html += '<button class="btn-approve" onclick="unholdApplication(\'' + docId + '\')">Move to Pending</button>';
                        html += '<button class="btn-reject" onclick="rejectApplication(\'' + docId + '\')">Reject</button>';
                    }
                    html += '</div>';

                    html += '</div>';
                });

                listEl.innerHTML = html;
                countEl.textContent = term
                    ? filtered.length + ' of ' + total + ' ' + status + ' application' + plural
                    : total + ' ' + status + ' application' + plural;
            }

            function field(label, value) {
                return '<div class="app-field"><strong>' + escapeHtml(label) + ':</strong> ' + escapeHtml(value || 'N/A') + '</div>';
            }

            // ---- Put a pending application on hold ----
            function holdApplication(docId) {
                if (!confirm('Put this application on hold?')) return;

                db.collection('applications').doc(docId).update({
                    status: 'hold',
                    heldAt: firebase.firestore.FieldValue.serverTimestamp(),
                    heldBy: auth.currentUser.email
                })
                .then(function () {
                    showAdminMessage('Application placed on hold.', '#ffcc00');
                    loadApplications(currentTab);
                })
                .catch(function (error) {
                    showAdminMessage('Error: ' + error.message, '#ff6b6b');
                });
            }

            // ---- Move a held application back to pending ----
            function unholdApplication(docId) {
                if (!confirm('Move this application back to pending?')) return;

                db.collection('applications').doc(docId).update({
                    status: 'pending',
                    movedToPendingAt: firebase.firestore.FieldValue.serverTimestamp(),
                    movedToPendingBy: auth.currentUser.email
                })
                .then(function () {
                    showAdminMessage('Application moved back to pending.', 'lightgreen');
                    loadApplications(currentTab);
                })
                .catch(function (error) {
                    showAdminMessage('Error: ' + error.message, '#ff6b6b');
                });
            }

            // ---- Approve Attendance ----
            // Marks an Attendance Request as approved without creating a
            // Firebase Auth account. Use approveApplication for membership
            // requests where a login should be provisioned.
            function approveAttendance(docId, email, displayName) {
                if (!confirm('Approve attendance for ' + displayName + '?')) return;

                db.collection('applications').doc(docId).update({
                    status: 'approved',
                    approvedAt: firebase.firestore.FieldValue.serverTimestamp(),
                    approvedBy: auth.currentUser.email
                })
                .then(function () {
                    showAdminMessage('Attendance approved for ' + displayName + '.', 'lightgreen');
                    loadApplications(currentTab);
                })
                .catch(function (error) {
                    showAdminMessage('Error: ' + error.message, '#ff6b6b');
                });
            }

            // ---- Approve: create Firebase Auth account ----
            function approveApplication(docId, email, displayName) {
                if (!confirm('Approve ' + displayName + ' and create their login account?')) return;

                // Generate a temporary password
                var tempPassword = generateTempPassword();

                // Use a secondary Firebase app so we don't sign out the admin
                var secondaryApp;
                try {
                    secondaryApp = firebase.app('secondary');
                } catch (e) {
                    secondaryApp = firebase.initializeApp(firebaseConfig, 'secondary');
                }

                var secondaryAuth = secondaryApp.auth();

                secondaryAuth.createUserWithEmailAndPassword(email, tempPassword)
                    .then(function (userCredential) {
                        // Set display name
                        return userCredential.user.updateProfile({ displayName: displayName })
                            .then(function () {
                                return secondaryAuth.signOut();
                            })
                            .then(function () {
                                // Update application status in Firestore
                                return db.collection('applications').doc(docId).update({
                                    status: 'approved',
                                    approvedAt: firebase.firestore.FieldValue.serverTimestamp(),
                                    approvedBy: auth.currentUser.email,
                                    authUid: userCredential.user.uid
                                });
                            });
                    })
                    .then(function () {
                        showAdminMessage('Approved! Account created for ' + displayName + '. Temporary password: ' + tempPassword, 'lightgreen');
                        // Send password reset so they can set their own password
                        auth.sendPasswordResetEmail(email);
                        loadApplications(currentTab);
                    })
                    .catch(function (error) {
                        if (error.code === 'auth/email-already-in-use') {
                            // Account already exists — just approve the application
                            db.collection('applications').doc(docId).update({
                                status: 'approved',
                                approvedAt: firebase.firestore.FieldValue.serverTimestamp(),
                                approvedBy: auth.currentUser.email
                            }).then(function () {
                                showAdminMessage('Approved! (Account already existed for ' + email + ')', '#ffcc00');
                                loadApplications(currentTab);
                            });
                        } else {
                            showAdminMessage('Error: ' + error.message, '#ff6b6b');
                        }
                    });
            }

            // ---- Reject ----
            function rejectApplication(docId) {
                if (!confirm('Reject this application?')) return;

                db.collection('applications').doc(docId).update({
                    status: 'rejected',
                    rejectedAt: firebase.firestore.FieldValue.serverTimestamp(),
                    rejectedBy: auth.currentUser.email
                })
                .then(function () {
                    showAdminMessage('Application rejected.', '#ffcc00');
                    loadApplications(currentTab);
                })
                .catch(function (error) {
                    showAdminMessage('Error: ' + error.message, '#ff6b6b');
                });
            }

            // ---- Helpers ----
            function generateTempPassword() {
                var chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789!@#$';
                var password = '';
                for (var i = 0; i < 12; i++) {
                    password += chars.charAt(Math.floor(Math.random() * chars.length));
                }
                return password;
            }

            function escapeHtml(str) {
                if (str == null) return '';
                return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
            }

            function escapeAttr(str) {
                if (str == null) return '';
                return String(str).replace(/'/g, "\\'").replace(/"/g, '\\"');
            }

            function showAdminMessage(msg, color) {
                var el = document.getElementById('admin-message');
                el.textContent = msg;
                el.style.color = color;
                el.style.display = 'block';
                setTimeout(function () { el.style.display = 'none'; }, 15000);
            }

            // ---- Export approved members as CSV ----
            function exportMembersCsv() {
                var btn = document.getElementById('export-members-btn');
                btn.disabled = true;
                var originalText = btn.textContent;
                btn.textContent = 'Exporting...';

                db.collection('applications')
                    .where('status', '==', 'approved')
                    .orderBy('submittedAt', 'desc')
                    .get()
                    .then(function (snapshot) {
                        if (snapshot.empty) {
                            showAdminMessage('No approved members to export.', '#ffcc00');
                            return;
                        }

                        // Preferred column order for known fields; any
                        // additional keys present on docs are appended after.
                        var preferred = [
                            'doc_id', 'type', 'userId', 'status',
                            'full_name', 'preferred_name', 'email', 'phone',
                            'fetlife_name', 'birthday',
                            'event_name', 'event_date',
                            'roles', 'attended_before', 'experience',
                            'community_contribution', 'elegance_meaning',
                            'dietary', 'notes', 'standards_agreement',
                            'submittedAt', 'approvedAt', 'approvedBy',
                            'rejectedAt', 'rejectedBy'
                        ];

                        var docs = [];
                        var keySet = {};
                        snapshot.forEach(function (doc) {
                            var d = doc.data();
                            d.doc_id = doc.id;
                            docs.push(d);
                            Object.keys(d).forEach(function (k) { keySet[k] = true; });
                        });

                        var headers = preferred.filter(function (k) { return keySet[k]; });
                        Object.keys(keySet).sort().forEach(function (k) {
                            if (headers.indexOf(k) === -1) headers.push(k);
                        });

                        var rows = [headers];
                        docs.forEach(function (d) {
                            rows.push(headers.map(function (k) { return formatCsvValue(d[k]); }));
                        });

                        downloadCsv(rows, 'members_' + todayStamp() + '.csv');
                        showAdminMessage('Exported ' + (rows.length - 1) + ' member(s).', 'lightgreen');
                    })
                    .catch(function (error) {
                        showAdminMessage('Export failed: ' + error.message, '#ff6b6b');
                    })
                    .finally(function () {
                        btn.disabled = false;
                        btn.textContent = originalText;
                    });
            }

            function downloadCsv(rows, filename) {
                var csv = rows.map(function (row) {
                    return row.map(csvEscape).join(',');
                }).join('\r\n');
                // Prepend UTF-8 BOM so Excel opens it correctly.
                var blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
                var url = URL.createObjectURL(blob);
                var a = document.createElement('a');
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }

            function csvEscape(value) {
                if (value == null) return '';
                var s = String(value);
                if (/[",\r\n]/.test(s)) {
                    s = '"' + s.replace(/"/g, '""') + '"';
                }
                return s;
            }

            // Convert any Firestore field value to a CSV-friendly string.
            // Handles Timestamps, arrays, plain objects, primitives, and null.
            function formatCsvValue(v) {
                if (v == null) return '';
                if (typeof v.toDate === 'function') return v.toDate().toISOString();
                if (Array.isArray(v)) return v.map(formatCsvValue).join('; ');
                if (typeof v === 'object') {
                    try { return JSON.stringify(v); } catch (e) { return String(v); }
                }
                return String(v);
            }

            function todayStamp() {
                var d = new Date();
                var pad = function (n) { return n < 10 ? '0' + n : '' + n; };
                return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
            }
        </script>

        <div w3-include-html="footer.html"></div>
        <script>
            includeHTML();
            initAuthUI();
        </script>

    </div>

</body>
</html>
