<!DOCTYPE HTML>
<html lang="en">
<head>
<base href="/XR/"><script>(function(){var h=location.hostname;if(h==="localhost"||h==="127.0.0.1"||location.protocol==="file:")document.querySelector("base").href=location.href.replace(/[^/]*$/,"");})();</script>
<META charset="UTF-8">
<META name="viewport" content="width=device-width, initial-scale=1.0">
<META name="description" content="Xanadu Reserve Attendee Information Form — submit your details for the upcoming event and receive your promo code.">
<meta name="robots" content="noindex, follow">
<meta name="rating" content="adult">
<meta name="google-site-verification" content="oQny7m5f65B-R0KY6N6IC9aXN42LlqNNZcL_BCFlYw0" />
<link rel="canonical" href="https://www.xanadukink.com/XR/info.html">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#daa520">
<title>Attendee Information Form — Xanadu Reserve</title>
<link rel="stylesheet" href="style.css">
<script type="text/javascript" src="utils.js"></script>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
</head>

<body style="color: rgb(171, 119, 14);">

    <div>

        <div w3-include-html="nav.html"></div>

        <p class="page_title">Xanadu Reserve Attendee Information Form</p>

        <div style="max-width: 700px; margin: 30px auto; padding: 20px;">
            <h2 style="text-align: center; border-bottom: 1px solid goldenrod; padding-bottom: 10px;">Attendee Information Form</h2>

            <form id="attendeeInformationForm" onsubmit="return submitAttendeeInformationForm(event);" style="display: flex; flex-direction: column; gap: 15px;">

                <label>Event Name:
                    <input type="text" name="event_name" required
                        style="width: 100%; padding: 8px; background: #1a1a1a; color: goldenrod; border: 1px solid goldenrod; box-sizing: border-box;">
                </label>

                <label>Event Date:
                    <input type="date" name="event_date" required
                        style="padding: 8px; background: #1a1a1a; color: goldenrod; border: 1px solid goldenrod;">
                </label>

                <label>Full Name:
                    <input type="text" name="full_name" required
                        style="width: 100%; padding: 8px; background: #1a1a1a; color: goldenrod; border: 1px solid goldenrod; box-sizing: border-box;">
                </label>

                <label>Preferred Name / Nickname:
                    <input type="text" name="preferred_name"
                        style="width: 100%; padding: 8px; background: #1a1a1a; color: goldenrod; border: 1px solid goldenrod; box-sizing: border-box;">
                </label>

                <label>FetLife Name:
                    <input type="text" name="fetlife_name"
                        style="width: 100%; padding: 8px; background: #1a1a1a; color: goldenrod; border: 1px solid goldenrod; box-sizing: border-box;">
                </label>

                <label>Email Address:
                    <input type="email" name="email" required
                        style="width: 100%; padding: 8px; background: #1a1a1a; color: goldenrod; border: 1px solid goldenrod; box-sizing: border-box;">
                </label>

                <label>Phone Number:
                    <input type="tel" name="phone"
                        style="width: 100%; padding: 8px; background: #1a1a1a; color: goldenrod; border: 1px solid goldenrod; box-sizing: border-box;">
                </label>

                <label>Date of Birth (must be 21+):
                    <input type="date" name="birthday" required
                        style="padding: 8px; background: #1a1a1a; color: goldenrod; border: 1px solid goldenrod;">
                </label>

                <fieldset style="border: 1px solid goldenrod; padding: 15px;">
                    <legend>Have you attended a High Protocol event with us before?</legend>
                    <label style="margin-right: 20px;"><input type="radio" name="attended_before" value="Yes"> Yes</label>
                    <label><input type="radio" name="attended_before" value="No"> No</label>
                </fieldset>

                <fieldset style="border: 1px solid goldenrod; padding: 15px;">
                    <legend>Experience with BDSM/kink:</legend>
                    <label style="margin-right: 20px;"><input type="radio" name="experience" value="Beginner"> Beginner</label>
                    <label style="margin-right: 20px;"><input type="radio" name="experience" value="Intermediate"> Intermediate</label>
                    <label><input type="radio" name="experience" value="Advanced"> Advanced</label>
                </fieldset>

                <fieldset style="border: 1px solid goldenrod; padding: 15px;">
                    <legend>Roles you identify with (select all that apply):</legend>
                    <label style="margin-right: 20px;"><input type="checkbox" name="roles" value="Dominant"> Dominant</label>
                    <label style="margin-right: 20px;"><input type="checkbox" name="roles" value="Submissive"> Submissive</label>
                    <label style="margin-right: 20px;"><input type="checkbox" name="roles" value="Switch"> Switch</label>
                    <label style="margin-right: 10px;"><input type="checkbox" name="roles" value="Other" id="roleOtherCheckbox" onchange="document.getElementById('roleOtherText').disabled = !this.checked;"> Other:</label>
                    <input type="text" name="role_other" id="roleOtherText" disabled placeholder="Please specify"
                        style="width: 200px; padding: 5px; background: #1a1a1a; color: goldenrod; border: 1px solid goldenrod;">
                </fieldset>

                <label>What does elegance mean to you?
                    <textarea name="elegance_meaning" rows="4"
                        style="width: 100%; padding: 8px; background: #1a1a1a; color: goldenrod; border: 1px solid goldenrod; box-sizing: border-box; resize: vertical;"></textarea>
                </label>

                <label>Dietary Restrictions / Allergies:
                    <textarea name="dietary" rows="3"
                        style="width: 100%; padding: 8px; background: #1a1a1a; color: goldenrod; border: 1px solid goldenrod; box-sizing: border-box; resize: vertical;"></textarea>
                </label>

                <label>Additional Notes / Accessibility Needs:
                    <textarea name="notes" rows="3"
                        style="width: 100%; padding: 8px; background: #1a1a1a; color: goldenrod; border: 1px solid goldenrod; box-sizing: border-box; resize: vertical;"></textarea>
                </label>

                <label>Today's Date:
                    <input type="date" name="todays_date" id="todaysDate" required readonly
                        style="padding: 8px; background: #1a1a1a; color: goldenrod; border: 1px solid goldenrod;">
                </label>

                <fieldset style="border: 1px solid goldenrod; padding: 15px;">
                    <legend>Community Standards Agreement</legend>
                    <label style="display: flex; align-items: flex-start; gap: 10px; line-height: 1.5;">
                        <input type="checkbox" name="standards_agreement" id="standardsAgreement" required style="margin-top: 4px;">
                        <span>
                            I have read and agree to the
                            <a class="alt" href="community_standards.html" target="_blank" rel="noopener">Xanadu Reserve Community Standards</a>
                            — including the agreements on consent, discretion, respect, safety, and accountability.
                            I understand that attendance at any Reserve gathering is conditional on my adherence to these standards.
                        </span>
                    </label>
                </fieldset>

                <div style="text-align: center; margin-top: 10px;">
                    <button type="submit"
                        style="padding: 12px 40px; background: goldenrod; color: black; border: none; font-size: 16px; font-weight: bold; cursor: pointer;">
                        Submit Information
                    </button>
                </div>

                <p id="formMessage" style="text-align: center; display: none;"></p>

            </form>
        </div>

        <script>
            // Auto-fill today's date
            document.getElementById('todaysDate').valueAsDate = new Date();

            // Pre-fill event name and date from URL search params
            var params = new URLSearchParams(window.location.search);
            if (params.get('event_name')) {
                var nameInput = document.querySelector('input[name="event_name"]');
                nameInput.value = params.get('event_name');
                nameInput.readOnly = true;
            }
            if (params.get('event_date')) {
                var dateInput = document.querySelector('input[name="event_date"]');
                dateInput.value = params.get('event_date');
                dateInput.readOnly = true;
            }

            function submitAttendeeInformationForm(event) {
                event.preventDefault();

                var form = document.getElementById('attendeeInformationForm');
                var formData = new FormData(form);

                // Validate age from birthday
                var birthday = new Date(formData.get('birthday'));
                var today = new Date();
                var age = today.getFullYear() - birthday.getFullYear();
                var m = today.getMonth() - birthday.getMonth();
                if (m < 0 || (m === 0 && today.getDate() < birthday.getDate())) {
                    age--;
                }
                if (isNaN(age) || age < 21) {
                    showMessage('You must be 21 or older to register.', 'red');
                    return false;
                }

                // Validate Community Standards agreement
                var standardsCheckbox = document.getElementById('standardsAgreement');
                if (!standardsCheckbox || !standardsCheckbox.checked) {
                    showMessage('Please confirm that you have read and agree to the Community Standards.', 'red');
                    return false;
                }

                // Gather selected roles
                var roles = [];
                document.querySelectorAll('input[name="roles"]:checked').forEach(function(cb) {
                    roles.push(cb.value);
                });
                var roleOther = formData.get('role_other');
                if (roles.indexOf('Other') !== -1 && roleOther) {
                    roles[roles.indexOf('Other')] = 'Other: ' + roleOther;
                }

                var data = {
                    type: 'Attendance Request',
                    userId: null,
                    event_name: formData.get('event_name') || '',
                    event_date: formData.get('event_date') || '',
                    full_name: formData.get('full_name') || '',
                    preferred_name: formData.get('preferred_name') || '',
                    fetlife_name: formData.get('fetlife_name') || '',
                    email: formData.get('email') || '',
                    phone: formData.get('phone') || '',
                    birthday: formData.get('birthday') || '',
                    attended_before: formData.get('attended_before') || '',
                    experience: formData.get('experience') || '',
                    roles: roles.length > 0 ? roles : [''],
                    dietary: formData.get('dietary') || '',
                    community_contribution: '',
                    elegance_meaning: formData.get('elegance_meaning') || '',
                    notes: formData.get('notes') || 'None',
                    standards_agreement: true,
                    status: 'pending',
                    submittedAt: firebase.firestore.FieldValue.serverTimestamp()
                };

                // Save to Firestore (encrypted at rest, access controlled by rules)
                db.collection('attendee_info').add(data)
                    .then(function () {
                        showMessage('Your information has been submitted. We\'ll be in touch with your promo code.', 'lightgreen');
                        form.reset();
                        document.getElementById('todaysDate').valueAsDate = new Date();
                    })
                    .catch(function (error) {
                        showMessage('Error submitting information: ' + error.message, 'red');
                    });

                return false;
            }

            function showMessage(msg, color) {
                var el = document.getElementById('formMessage');
                el.textContent = msg;
                el.style.color = color;
                el.style.display = 'block';
            }
        </script>

        <div w3-include-html="footer.html"></div>
        <script>
            includeHTML();
            initAuthUI();
        </script>

    </div>

</body>
</html>
