<!DOCTYPE HTML>
<html lang="en">
<head>
<base href="/PET/"><script>(function(){var h=location.hostname;if(h==="localhost"||h==="127.0.0.1"||location.protocol==="file:")document.querySelector("base").href=location.href.replace(/[^/]*$/,"");})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="P.E.T. chapter leader login — sign in to access the leadership library and your profile.">
<meta name="robots" content="noindex, follow">
<meta name="rating" content="adult">
<title>Leader Login — Power Exchange Together</title>
<link rel="stylesheet" href="style.css">
<script type="text/javascript" src="utils.js"></script>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
</head>

<body>

    <div w3-include-html="nav.html"></div>

    <section class="hero">
        <p class="eyebrow">Chapter Leadership</p>
        <h1 class="page_title">Leader Login</h1>
    </section>

    <div class="container">
        <div class="panel form-wrap">

            <!-- Login form -->
            <div id="login-section">
                <form id="loginForm" class="pet-form" onsubmit="return handleLogin(event);">
                    <label>Email Address
                        <input type="email" id="loginEmail" required>
                    </label>
                    <label>Password
                        <input type="password" id="loginPassword" required minlength="6">
                    </label>
                    <div class="text-center">
                        <button type="submit" class="btn-accent">Login</button>
                    </div>
                    <p id="loginMessage" class="auth-message"></p>
                </form>

                <p class="text-center auth-hide" style="margin-top: 18px;">
                    Not a leader yet? <a href="join.html">Apply for a leadership account</a>
                </p>
                <p class="text-center">
                    <a href="#" onclick="handlePasswordReset(); return false;">Forgot password?</a>
                </p>
            </div>

            <!-- Logged-in state -->
            <div id="loggedIn-section" style="display: none;" class="text-center">
                <h2>Welcome Back</h2>
                <p class="text">You are signed in as <strong id="loggedInName"></strong>.</p>
                <p style="margin-top: 18px;">
                    <a href="library.html">Open the Library</a> &nbsp;·&nbsp;
                    <a href="profile.html">My Profile</a>
                </p>
                <div style="margin-top: 20px;">
                    <button class="btn-outline" onclick="auth.signOut();">Logout</button>
                </div>
            </div>

        </div>
    </div>

    <div w3-include-html="footer.html"></div>
    <script>
        includeHTML();
        initAuthUI();
    </script>

    <script>
        function showAuthMessage(id, msg, color) {
            var el = document.getElementById(id);
            el.textContent = msg;
            el.style.color = color;
        }

        function getFriendlyError(error) {
            switch (error.code) {
                case 'auth/user-not-found':
                case 'auth/invalid-credential':
                case 'auth/wrong-password':
                    return 'Invalid email or password.';
                case 'auth/too-many-requests':
                    return 'Too many attempts. Please try again later.';
                default:
                    return error.message;
            }
        }

        function handleLogin(event) {
            event.preventDefault();
            var email = document.getElementById('loginEmail').value;
            var password = document.getElementById('loginPassword').value;
            auth.signInWithEmailAndPassword(email, password)
                .then(function () { window.location.href = 'library.html'; })
                .catch(function (error) {
                    showAuthMessage('loginMessage', getFriendlyError(error), '#b23b3b');
                });
            return false;
        }

        function handlePasswordReset() {
            var email = document.getElementById('loginEmail').value;
            if (!email) {
                showAuthMessage('loginMessage', 'Enter your email above, then click "Forgot password?"', '#a9832f');
                return;
            }
            auth.sendPasswordResetEmail(email)
                .then(function () {
                    showAuthMessage('loginMessage', 'Password reset email sent. Check your inbox.', '#2e7d32');
                })
                .catch(function (error) {
                    showAuthMessage('loginMessage', getFriendlyError(error), '#b23b3b');
                });
        }

        // Toggle sections based on auth state.
        auth.onAuthStateChanged(function (user) {
            var loginSection = document.getElementById('login-section');
            var loggedInSection = document.getElementById('loggedIn-section');
            if (user) {
                loginSection.style.display = 'none';
                loggedInSection.style.display = 'block';
                document.getElementById('loggedInName').textContent = user.displayName || user.email;
            } else {
                loginSection.style.display = 'block';
                loggedInSection.style.display = 'none';
            }
        });
    </script>

</body>
</html>
